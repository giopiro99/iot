apiVersion: apps/v1
# configuro un deployment, e' un livello di astrazione sopra i pod.
# noi useremo sempre i deployment, saranno loro ad interfacciarsi con i pod e a gestirli
kind: Deployment
metadata:
  name: my-app-deployment-1
  labels:
    app: my-app-1
# quante repliche di questi pod gestiti dal deployment vogliamo?
spec:
  replicas: 1
  
  # Il Deployment userà questo selettore per "contare" i Pod attivi
  selector:
    matchLabels:
      app: my-app-1

  # Il "Template" è il blueprint che Kubernetes usa per creare i singoli Pod
  template:
    metadata:
      labels:
        app: my-app-1
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.2
          ports:
            - containerPort: 80 # nginx utilizza questa porta (o 443)
          volumeMounts:
            - name: config-vol-1
              mountPath: /usr/share/nginx/html
      volumes:
        - name: config-vol-1
          configMap:
            name: app-config-1

---

# configurazione del service.
# siccome i pod quando nascono e muoiono cambiano ip, si sono inventati il service.
# questo componente ha un ip fisso e il suo ciclo vita non e' legato ai pod a cui viene "attaccato"
apiVersion: v1
kind: Service
metadata:
  name: app-service-1
spec:
  selector:
    # gli stiamo dando lo stesso nome dei pod a cui fara' riferimento
    app: my-app-1
  ports:
    - protocol: TCP
      port: 80        # Porta esposta dal Service, di solito si da la stessa del container di riferimento
      targetPort: 80  # Porta reale su cui è in ascolto il container