global:
  kas:
    enabled: false
  hosts:
    domain: gitlab.exemple.com
    https: false
  ingress:
    installCertmanager: false
    tls:
      enabled: false
  ## https://docs.gitlab.com/charts/charts/globals#configure-postgresql-settings
  psql:
    knownDecompositions:
      - main
      - ci
      - embedding
      - sec
    password:
      useSecret: true
      secret: postgres-credentials
      key: password
    host: my-postgres-postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production

  ## https://docs.gitlab.com/charts/charts/globals#configure-redis-settings
  redis:
    auth:
      enabled: true
      secret: redis-credentials
      key: redis-password
    host: redis-master.gitlab.svc.cluster.local
    port: 6379

  #configurazione dell object storage
  appConfig:
    object_store:
      enabled: true
      connection:
        secret: s3-connection-secret
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp

  shell:
    port: 32022
  
  registry:
    enabled: false

postgresql:
  install: false
redis:
  install: false
gitlab-runner:
  install: false
certmanager-issuer: 
  email: giovannipirozzi12345@gmail.com
registry:
  enabled: false
prometheus:
  install: false

gitlab:
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  gitlab-exporter:
    enabled: false
  webservice:
    minReplicas: 1
    maxReplicas: 1
    workerProcesses: 1
  kas:
    enabled: false
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    concurrency: 5
  toolbox:
    backups:
      objectStorage:
        config:
          secret: s3-connection-secret
          key: connection